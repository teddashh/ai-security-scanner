name: Publish managed Garak engine image

on:
  push:
    branches:
      - main
    paths:
      - engines/images/garak/**
      - '!engines/images/garak/plan.json'
      - '!engines/images/garak/testdata/**'
      - '!engines/images/garak/**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-garak-engine-image-0.17.0-1
  cancel-in-progress: false

env:
  ENGINE: garak
  IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-garak
  IMAGE_TAG: 0.17.0-1

jobs:
  publish:
    name: Publish Garak for amd64 + arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the bounded native transport launcher
        run: |
          docker run --rm --network none \
            -v "${PWD}/engines/images/garak/launcher:/src:ro" \
            python:3.11.16-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7 \
            python -I -B /src/main_test.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engines/images/garak/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=managed-engine-garak
          cache-to: type=gha,mode=max,scope=managed-engine-garak

      - name: Publish anonymous pull access
        if: steps.guard.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Verify both platforms and genuine native TLS probes
        id: verify
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          raw_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          test "$(jq '.manifests | length' <<<"${raw_manifest}")" -eq 2
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${raw_manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${raw_manifest}")"
          test "${amd64_digest#sha256:}" != "${amd64_digest}"
          test "${arm64_digest#sha256:}" != "${arm64_digest}"
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          docker run --platform linux/amd64 --rm \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HOME=/tmp/aiss-import -e XDG_CONFIG_HOME=/tmp/aiss-import/config \
            -e XDG_DATA_HOME=/tmp/aiss-import/data -e XDG_CACHE_HOME=/tmp/aiss-import/cache \
            --entrypoint /usr/local/bin/python3 \
            "${IMAGE}@${DIGEST}" \
            -I -B -c 'import importlib.util,garak,garak.cli,garak.generators.rest,garak.probes.dan,garak.probes.ansiescape,garak.detectors.dan,garak.detectors.ansiescape; assert garak.__version__ == "0.17.0"; assert all(importlib.util.find_spec(name) is None for name in ("torch","transformers","openai","pytest","flit_core"))'
          smoke_evidence="package-evidence/garak-managed-smoke"
          python3 engines/images/garak/testdata/native_smoke.py \
            --image "${IMAGE}@${DIGEST}" --output-dir "${smoke_evidence}"
          (
            cd "${smoke_evidence}"
            sha256sum report.jsonl garak-execution.json native-qa.json > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          evidence_sha256="sha256:$(sha256sum "${smoke_evidence}/SHA256SUMS.txt" | cut -d ' ' -f 1)"
          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "evidence_sha256=${evidence_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record the published index and platform digests
        env:
          AMD64_DIGEST: ${{ steps.verify.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.verify.outputs.arm64_digest }}
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          EVIDENCE_SHA256: ${{ steps.verify.outputs.evidence_sha256 }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p package-evidence
          jq -n \
            --arg engine "${ENGINE}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg amd64Digest "${AMD64_DIGEST}" \
            --arg arm64Digest "${ARM64_DIGEST}" \
            --arg evidenceSha256 "${EVIDENCE_SHA256}" \
            --arg revision "${REVISION}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, anonymousPullVerified: true, managedSmokeEvidenceSha256: $evidenceSha256}' \
            > package-evidence/garak-image-manifest.json
          printf 'Published and anonymously verified `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve signed publication and per-platform SBOM evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          mode: ${{ steps.guard.outputs.mode }}
          engine: ${{ env.ENGINE }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          mode: ${{ steps.guard.outputs.mode }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Seal the downloadable evidence inventory
        run: |
          set -o pipefail
          (
            cd package-evidence
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garak-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
