name: Publish managed cloud engine images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/engine-images-cloud.yml
      - .github/actions/engine-image-evidence/**
      - engines/images/cloud-launcher/**
      - engines/images/cloudquery/**
      - '!engines/images/cloudquery/plan.json'
      - engines/images/cloudsplaining/**
      - '!engines/images/cloudsplaining/plan.json'
      - engines/images/prowler/**
      - '!engines/images/prowler/plan.json'
      - engines/images/scoutsuite/**
      - '!engines/images/scoutsuite/plan.json'
      - engines/images/steampipe/**
      - '!engines/images/steampipe/plan.json'
      - scripts/engine-image-evidence.mjs
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-cloud-engine-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.engine }} for amd64 + arm64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: cloudquery
            tag: 2.0.31-aws9.2.0-1
            dockerfile: engines/images/cloudquery/Dockerfile
          - engine: prowler
            tag: 5.39.1-1
            dockerfile: engines/images/prowler/Dockerfile
          - engine: cloudsplaining
            tag: 0.9.1-1
            dockerfile: engines/images/cloudsplaining/Dockerfile
          - engine: scoutsuite
            tag: 5.14.0-1
            dockerfile: engines/images/scoutsuite/Dockerfile
          - engine: steampipe
            tag: 2.4.5-1
            dockerfile: engines/images/steampipe/Dockerfile
    env:
      IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-${{ matrix.engine }}
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=engine-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=engine-${{ matrix.engine }}

      - name: Publish anonymous pull access
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Verify unauthenticated digest access
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Run the anonymous CloudQuery amd64 smoke contract
        if: matrix.engine == 'cloudquery'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "${reference}"
          test "$(docker image inspect "${reference}" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "${reference}" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/ai-security-scanner-cloud-launcher"]'
          test "$(docker image inspect "${reference}" --format '{{index .Config.Labels "io.ai-security-scanner.profile"}}')" = "aws-iam-us-east-1"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /app/cloudquery "${reference}" --version | grep -F 'cloudquery version 2.0.31'
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/libexec/cloudquery-source-aws "${reference}" --help >/dev/null
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/libexec/cloudquery-destination-file "${reference}" --help >/dev/null
          if docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            "${reference}" --engine cloudquery --scope /run/ai-security-scanner/scope.json --output /output; then
            echo 'CloudQuery launcher accepted missing protected mounts' >&2
            exit 1
          fi
          evidence="$(mktemp -d)"
          container="$(docker create --platform linux/amd64 "${reference}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true; rm -rf "${evidence}"' EXIT
          docker cp "${container}:/usr/share/source/cloudquery/." "${evidence}/"
          printf '%s  %s\n' \
            21e18c3d1348243273231e72a39febd9d7429ac4f1ec36c5bf18c32d509e5996 "${evidence}/cli-e27e4ab.tar.gz" \
            a4788989f99ab02144605539ab552e86c076405ac7516fb673e73ba6bda40c6b "${evidence}/aws-804be3a.tar.gz" \
            21f4b826b9ad4830854130674023b97e443abba17b66a3557cd0805b3083b2d1 "${evidence}/file-05f0233.tar.gz" \
            | sha256sum --check --strict
          jq -e '.registry == {mode:"local", authenticated:false, runtime_downloads:false}' \
            "${evidence}/build/dependencies.lock.json" >/dev/null

      - name: Record the published index digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test "${DIGEST#sha256:}" != "${DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${manifest}")"
          mkdir -p package-evidence
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg revision "${REVISION}" \
            --arg amd64Digest "${amd64_digest}" \
            --arg arm64Digest "${arm64_digest}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platforms: ["linux/amd64", "linux/arm64"], platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, public: true}' \
            > "package-evidence/${{ matrix.engine }}-image-manifest.json"
          printf 'Published `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve publication evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          engine: ${{ matrix.engine }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.engine }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
