name: Publish managed cloud engine images

on:
  push:
    branches:
      - main
    paths:
      - engines/images/cloud-launcher/**
      - engines/images/cloudquery/**
      - '!engines/images/cloudquery/plan.json'
      - engines/images/cloudsplaining/**
      - '!engines/images/cloudsplaining/plan.json'
      - engines/images/prowler/**
      - '!engines/images/prowler/plan.json'
      - engines/images/scoutsuite/**
      - '!engines/images/scoutsuite/plan.json'
      - engines/images/steampipe/**
      - '!engines/images/steampipe/plan.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-cloud-engine-images
  cancel-in-progress: false

env:
  CLOUD_ENGINE_MATRIX: >-
    [{"engine":"cloudquery","tag":"2.0.31-aws9.2.0-4","dockerfile":"engines/images/cloudquery/Dockerfile"},{"engine":"prowler","tag":"5.39.1-5","dockerfile":"engines/images/prowler/Dockerfile"},{"engine":"cloudsplaining","tag":"0.9.1-4","dockerfile":"engines/images/cloudsplaining/Dockerfile"},{"engine":"scoutsuite","tag":"5.14.0-4","dockerfile":"engines/images/scoutsuite/Dockerfile"},{"engine":"steampipe","tag":"2.4.5-4","dockerfile":"engines/images/steampipe/Dockerfile"}]

jobs:
  changes:
    name: Select affected cloud engines
    runs-on: ubuntu-24.04
    outputs:
      engines: ${{ steps.select.outputs.engines }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out the exact source revision with push history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select changed engines or the full manual matrix
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_REVISION: ${{ github.event.before }}
          AFTER_REVISION: ${{ github.sha }}
        run: >-
          node scripts/engine-image-evidence.mjs select-cloud-engines
          --event-name "${EVENT_NAME}"
          --before "${BEFORE_REVISION:-0000000000000000000000000000000000000000}"
          --after "${AFTER_REVISION}"
          --matrix-json "${CLOUD_ENGINE_MATRIX}"

  launcher-tests:
    name: Validate the cloud capability-boundary launcher
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run formatting and unit tests in the pinned toolchain
        run: |
          docker run --rm \
            -v "${PWD}/engines/images/cloud-launcher:/src:ro" \
            -w /src \
            golang:1.25.0-alpine3.22@sha256:f18a072054848d87a8077455f0ac8a25886f2397f88bfdd222d6fafbb5bba440 \
            sh -ceu 'test -z "$(gofmt -d main.go main_test.go)"; go test ./...'

  publish:
    name: Publish ${{ matrix.engine }} for amd64 + arm64
    needs:
      - changes
      - launcher-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-${{ matrix.engine }}
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=engine-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=engine-${{ matrix.engine }}

      - name: Publish anonymous pull access
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Verify unauthenticated digest access
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Run the anonymous CloudQuery amd64 smoke contract
        if: matrix.engine == 'cloudquery'
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "${reference}"
          test "$(docker image inspect "${reference}" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "${reference}" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/ai-security-scanner-cloud-launcher"]'
          test "$(docker image inspect "${reference}" --format '{{index .Config.Labels "io.ai-security-scanner.profile"}}')" = "aws-iam-us-east-1"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /app/cloudquery "${reference}" --version | grep -F 'cloudquery version 2.0.31'
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/libexec/cloudquery-source-aws "${reference}" --help >/dev/null
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/libexec/cloudquery-destination-file "${reference}" --help >/dev/null
          if docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            "${reference}" --engine cloudquery --scope /run/ai-security-scanner/scope.json --output /output; then
            echo 'CloudQuery launcher accepted missing protected mounts' >&2
            exit 1
          fi
          evidence="$(mktemp -d)"
          container="$(docker create --platform linux/amd64 "${reference}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true; rm -rf "${evidence}"' EXIT
          docker cp "${container}:/usr/share/source/cloudquery/." "${evidence}/"
          printf '%s  %s\n' \
            21e18c3d1348243273231e72a39febd9d7429ac4f1ec36c5bf18c32d509e5996 "${evidence}/cli-e27e4ab.tar.gz" \
            a4788989f99ab02144605539ab552e86c076405ac7516fb673e73ba6bda40c6b "${evidence}/aws-804be3a.tar.gz" \
            21f4b826b9ad4830854130674023b97e443abba17b66a3557cd0805b3083b2d1 "${evidence}/file-05f0233.tar.gz" \
            | sha256sum --check --strict
          jq -e '.registry == {mode:"local", authenticated:false, runtime_downloads:false}' \
            "${evidence}/build/dependencies.lock.json" >/dev/null

      - name: Run the anonymous Prowler amd64 patch and launcher contract
        if: matrix.engine == 'prowler'
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "${reference}"
          test "$(docker image inspect "${reference}" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "${reference}" --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/ai-security-scanner-cloud-launcher"]'
          test "$(docker image inspect "${reference}" --format '{{index .Config.Labels "io.ai-security-scanner.profile"}}')" = "aws-azure-gcp-narrow-iam"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /home/prowler/.venv/bin/python "${reference}" -c '
          import hashlib
          from pathlib import Path
          expected = {
              "prowler/lib/outputs/finding.py": "71d5665f11c27a3dc69660ac61b747264066c6791ba65014c50ba80105902749",
              "prowler/providers/azure/azure_provider.py": "51cef0e3e7ed819144959f62389d3eb169b97aa37baf37aab66d4c290d21bf14",
              "prowler/providers/azure/lib/arguments/arguments.py": "afb7c9b47f1b9b2354774579121db4f1c26d6b03112a3d0407fb4f14ad8625af",
              "prowler/providers/common/provider.py": "4fe43b204884910bfbceac5ebb3e0b2898c9c044b18d241b566cc9a53ae6cf04",
              "prowler/providers/gcp/gcp_provider.py": "c30756aaaa1ce3739c6bf2a023b4ab633656c767f1e6fa1e84ba4ff9fff1c34f",
              "prowler/providers/gcp/services/cloudresourcemanager/cloudresourcemanager_service.py": "379876877311fe2f4aa17bb9d5b132c85baaf2081210aebf6da59472cc11c9fe",
          }
          root = Path("/home/prowler")
          assert all(hashlib.sha256((root / path).read_bytes()).hexdigest() == digest for path, digest in expected.items())
          '
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /home/prowler/.venv/bin/prowler "${reference}" \
            aws --service iam --region us-east-1 \
            --output-formats json-ocsf --output-filename prowler --output-directory /output \
            --ignore-exit-code-3 --no-banner --no-color --skip-sh-update --help \
            | grep -F -- '--skip-sh-update'
          azure_expiry="$(( $(date +%s) + 1800 ))"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /home/prowler/.venv/bin/prowler "${reference}" \
            azure --access-token-auth --access-token-expires-at "${azure_expiry}" \
            --subscription-ids 11111111-2222-3333-4444-555555555555 --service iam \
            --output-formats json-ocsf --output-filename prowler --output-directory /output \
            --ignore-exit-code-3 --no-banner --no-color --help \
            | grep -F -- '--access-token-auth'
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint /home/prowler/.venv/bin/prowler "${reference}" \
            gcp --project-ids audit-project-123 \
            --checks iam_audit_logs_enabled iam_no_service_roles_at_project_level \
            iam_role_kms_enforce_separation_of_duties iam_role_sa_enforce_separation_of_duties \
            --skip-api-check --gcp-retries-max-attempts 2 \
            --output-formats json-ocsf --output-filename prowler --output-directory /output \
            --ignore-exit-code-3 --no-banner --no-color --help \
            | grep -F -- '--project-ids'
          if docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            "${reference}" --engine prowler --scope /run/ai-security-scanner/scope.json --output /output; then
            echo 'Prowler launcher accepted missing protected mounts' >&2
            exit 1
          fi

      - name: Record the published index digest
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test "${DIGEST#sha256:}" != "${DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${manifest}")"
          mkdir -p package-evidence
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg revision "${REVISION}" \
            --arg amd64Digest "${amd64_digest}" \
            --arg arm64Digest "${arm64_digest}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platforms: ["linux/amd64", "linux/arm64"], platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, public: true}' \
            > "package-evidence/${{ matrix.engine }}-image-manifest.json"
          printf 'Published `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve publication evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          engine: ${{ matrix.engine }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.engine }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
