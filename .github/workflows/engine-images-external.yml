name: Publish managed external engine images

on:
  push:
    branches:
      - main
    paths:
      - engines/images/external-launcher/**
      - engines/images/naabu/**
      - '!engines/images/naabu/plan.json'
      - engines/images/httpx/**
      - '!engines/images/httpx/plan.json'
      - engines/images/nuclei/**
      - '!engines/images/nuclei/plan.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-external-engine-images
  cancel-in-progress: false

jobs:
  launcher-tests:
    name: Validate the capability-boundary launcher
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run formatting and unit tests in the pinned toolchain
        run: |
          docker run --rm \
            -v "${PWD}/engines/images/external-launcher:/src:ro" \
            -w /src \
            golang:1.26.0-alpine@sha256:d4c4845f5d60c6a974c6000ce58ae079328d03ab7f721a0734277e69905473e5 \
            sh -ceu 'test -z "$(gofmt -d main.go main_test.go)"; go test ./...'

  publish:
    name: Publish ${{ matrix.engine }} for amd64 + arm64
    needs: launcher-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: naabu
            tag: 2.6.1-4
            version: 2.6.1
            dockerfile: engines/images/naabu/Dockerfile
          - engine: httpx
            tag: 1.10.0-4
            version: 1.10.0
            dockerfile: engines/images/httpx/Dockerfile
          - engine: nuclei
            tag: 3.11.1-4
            version: 3.11.1
            dockerfile: engines/images/nuclei/Dockerfile
    env:
      IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-${{ matrix.engine }}
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=external-engine-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=external-engine-${{ matrix.engine }}

      - name: Publish anonymous pull access
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Verify anonymous access and real scanner version
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          docker run --platform linux/amd64 --rm \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777 \
            --entrypoint "/usr/local/bin/${{ matrix.engine }}" \
            "${IMAGE}@${DIGEST}" -version 2>&1 | grep -F "${EXPECTED_VERSION}"

      - name: Record the published index digest
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test "${DIGEST#sha256:}" != "${DIGEST}"
          mkdir -p package-evidence
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg revision "${REVISION}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platforms: ["linux/amd64", "linux/arm64"], sourceRevision: $revision, public: true}' \
            > "package-evidence/${{ matrix.engine }}-image-manifest.json"
          printf 'Published `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve publication evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          engine: ${{ matrix.engine }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Seal the downloadable evidence inventory
        run: |
          set -o pipefail
          (
            cd package-evidence
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.engine }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
