name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run carries no event ancestry, so the classifier's unavailable-base
  # fallback schedules every lane. This is the only way to revalidate a commit
  # whose original run was skipped or classified narrowly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed boundaries
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      desktop: ${{ steps.classify.outputs.desktop }}
      engine: ${{ steps.classify.outputs.engine }}
      framework: ${{ steps.classify.outputs.framework }}
      release_contract: ${{ steps.classify.outputs.release_contract }}
      windows_runtime: ${{ steps.classify.outputs.windows_runtime }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Test changed-boundary and duplicated-skill drift guards
        run: node --test tests/ci/*.test.mjs
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi

          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ -z "$base_sha" ]]; then
            # Missing event ancestry must never turn into an accidental no-op.
            # The observable conservative fallback schedules every lane.
            echo "::warning::Base SHA is unavailable; scheduling every CI boundary."
            node scripts/ci/classify-changes.mjs --all >> "$GITHUB_OUTPUT"
          elif [[ "$base_sha" =~ ^0+$ ]]; then
            # GitHub uses an all-zero `before` SHA for the repository's root push.
            git diff-tree --root --no-renames --no-commit-id --name-only --diff-filter=ACMRD -r -z "$HEAD_SHA" |
              node scripts/ci/classify-changes.mjs --nul >> "$GITHUB_OUTPUT"
          else
            if git cat-file -e "${base_sha}^{commit}"; then
              git diff --no-renames --name-only --diff-filter=ACMRD -z "$base_sha" "$HEAD_SHA" -- |
                node scripts/ci/classify-changes.mjs --nul >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base commit is not present after full checkout; scheduling every CI boundary."
              node scripts/ci/classify-changes.mjs --all >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Record intentional documentation-only scope
        if: steps.classify.outputs.docs_only == 'true'
        shell: bash
        run: |
          echo "Documentation-only change: product, engine, framework, runtime, installer, and release jobs are intentionally skipped." |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record classifier-only scope
        if: >-
          steps.classify.outputs.docs_only != 'true' &&
          steps.classify.outputs.frontend != 'true' &&
          steps.classify.outputs.rust_core != 'true' &&
          steps.classify.outputs.desktop != 'true' &&
          steps.classify.outputs.engine != 'true' &&
          steps.classify.outputs.framework != 'true' &&
          steps.classify.outputs.release_contract != 'true' &&
          steps.classify.outputs.windows_runtime != 'true'
        shell: bash
        run: |
          echo "::warning::The change affects CI/classifier metadata or an unclassified path; only classifier tests are scheduled."
          echo "Classifier-only scope: review new functional paths and add the smallest relevant boundary when needed." |
            tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run test:component
      - run: npm run typecheck
      - run: npm run build

  engine-admission:
    name: Engine admission contracts
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run validate:engines
      - run: node --check scripts/engine-image-evidence.mjs
      - run: node --check scripts/generate-oci-layout-fixture.mjs

  framework-contract:
    name: Framework mapping contracts
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: npm run validate:aidefend

  release-contract:
    name: Release contract self-tests
    needs: changes
    if: needs.changes.outputs.release_contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run release:self-test
      - run: npm run test:release-evidence

  rust-core:
    name: Rust core and CLI
    needs: changes
    if: needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --no-default-features --features cli --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-default-features --features cli

  windows-managed-runtime:
    name: Windows managed-runtime repair
    needs: changes
    if: needs.changes.outputs.windows_runtime == 'true'
    runs-on: windows-2025
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          managed_runtime::tests
      - name: Test Windows export-identity ACL and legacy-key continuity
        run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          export_identity::tests
      - name: Parse Windows NSIS migration qualification scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @(
            "scripts/release/qualify-windows-nsis-upgrade.ps1",
            "scripts/release/qualify-windows-nsis-ghost-recovery.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw "$script has PowerShell parser errors: $($errors -join '; ')"
            }
          }
      - name: Test Windows installed gateway path normalization
        run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          managed_network::tests::installed_gateway_is_resolved_from_the_canonical_desktop_directory
          -- --exact
      - run: npm ci --ignore-scripts
      - name: Validate the pinned Windows NSIS source patch
        run: node scripts/release/validate-windows-nsis-template.mjs
      - name: Vendor the release-equivalent Windows managed runtime
        run: >-
          node runtime/vendor-managed-runtime.mjs
          --target x86_64-pc-windows-msvc
          --output runtime/staged/managed-runtime
      - name: Verify the staged Windows managed-runtime manifest and files
        run: >-
          node scripts/release/generate-runtime-evidence.mjs
          --manifest runtime/staged/managed-runtime/manifest.json
          --out target/ci-managed-runtime-evidence
          --platform windows-x86_64
          --expected-manifest-sha256 a8112473e5d87655e6145ea5f6cff569c872329d2ec14bfb9463078abcb60e3a
      - name: Build and stage required Windows sidecars
        run: npm run desktop:prepare-sidecar -- --target x86_64-pc-windows-msvc
      - name: Test the installer runtime-cache coordinator and build trust anchor
        run: >-
          cargo test --locked --package ai-security-scanner --no-default-features
          --features cli,installer-runtime-cache --bin ai-security-scanner-cli
          windows_installer_runtime_cache
      - name: Test the desktop build-to-runtime manifest trust anchor
        run: >-
          cargo test --locked --package ai-security-scanner --features desktop --lib
          managed_runtime::tests::desktop_build_anchor_matches_the_staged_manifest_used_for_packaging
          -- --exact
      - name: Compile Windows desktop
        run: cargo check --locked --package ai-security-scanner --features desktop --lib
      - name: Compile the reviewed custom NSIS installer
        run: >-
          npm run tauri build -- --ci --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked

  desktop-linux:
    name: Tauri Linux compile
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install Tauri system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libdbus-1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:prepare-sidecar -- --target x86_64-unknown-linux-gnu
      - run: cargo check --locked --package ai-security-scanner --features desktop
      - name: Test desktop scan preflight and persistence boundary
        run: >-
          cargo test --locked --package ai-security-scanner --features desktop --lib
          commands::tests

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - frontend
      - engine-admission
      - framework-contract
      - release-contract
      - rust-core
      - windows-managed-runtime
      - desktop-linux
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_EXPECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      ENGINE_EXPECTED: ${{ needs.changes.outputs.engine }}
      ENGINE_RESULT: ${{ needs['engine-admission'].result }}
      FRAMEWORK_EXPECTED: ${{ needs.changes.outputs.framework }}
      FRAMEWORK_RESULT: ${{ needs['framework-contract'].result }}
      RELEASE_EXPECTED: ${{ needs.changes.outputs.release_contract }}
      RELEASE_RESULT: ${{ needs['release-contract'].result }}
      RUST_EXPECTED: ${{ needs.changes.outputs.rust_core }}
      RUST_RESULT: ${{ needs['rust-core'].result }}
      WINDOWS_EXPECTED: ${{ needs.changes.outputs.windows_runtime }}
      WINDOWS_RESULT: ${{ needs['windows-managed-runtime'].result }}
      DESKTOP_EXPECTED: ${{ needs.changes.outputs.desktop }}
      DESKTOP_RESULT: ${{ needs['desktop-linux'].result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Verify every scheduled boundary completed
        run: node scripts/ci/classify-changes.mjs --verify-results
