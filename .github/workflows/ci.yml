name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - run: npm ci
      - run: npm run validate:engines
      - run: npm run release:validate
      - run: npm run release:self-test
      - run: npm run test:release-evidence
      - run: npm run test:frontend
      - run: npm run typecheck
      - run: npm run build

  rust-core:
    name: Rust core and CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --no-default-features --features cli --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-default-features --features cli

  windows-managed-runtime:
    name: Windows managed-runtime repair
    runs-on: windows-2025
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          managed_runtime::tests
      - name: Test Windows export-identity ACL and legacy-key continuity
        run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          export_identity::tests
      - name: Parse Windows NSIS migration qualification scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @(
            "scripts/release/qualify-windows-nsis-upgrade.ps1",
            "scripts/release/qualify-windows-nsis-ghost-recovery.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw "$script has PowerShell parser errors: $($errors -join '; ')"
            }
          }
      - name: Test Windows installed gateway path normalization
        run: >-
          cargo test --locked --package ai-security-scanner --no-default-features --lib
          managed_network::tests::installed_gateway_is_resolved_from_the_canonical_desktop_directory
          -- --exact
      - run: npm ci --ignore-scripts
      - name: Build and stage required Windows sidecars
        run: npm run desktop:prepare-sidecar -- --target x86_64-pc-windows-msvc
      - name: Vendor the release-equivalent Windows managed runtime
        run: >-
          node runtime/vendor-managed-runtime.mjs
          --target x86_64-pc-windows-msvc
          --output runtime/staged/managed-runtime
      - name: Verify the staged Windows managed-runtime manifest and files
        run: >-
          node scripts/release/generate-runtime-evidence.mjs
          --manifest runtime/staged/managed-runtime/manifest.json
          --out target/ci-managed-runtime-evidence
          --platform windows-x86_64
          --expected-manifest-sha256 a8112473e5d87655e6145ea5f6cff569c872329d2ec14bfb9463078abcb60e3a
      - name: Compile Windows desktop and UAC prerequisite repair
        run: cargo check --locked --package ai-security-scanner --features desktop --lib
      - name: Compile the reviewed custom NSIS installer
        run: >-
          npm run tauri build -- --ci --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked

  desktop-linux:
    name: Tauri Linux compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install Tauri system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libdbus-1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:prepare-sidecar -- --target x86_64-unknown-linux-gnu
      - run: cargo check --locked --package ai-security-scanner --features desktop
      - name: Test desktop scan preflight and persistence boundary
        run: >-
          cargo test --locked --package ai-security-scanner --features desktop --lib
          commands::tests
