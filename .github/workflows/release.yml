name: Release desktop installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      windows_data_preservation:
        description: Run optional N-1 and ambiguous-runtime data-preservation fixtures
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate immutable release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      source_date: ${{ steps.identity.outputs.source_date }}
      release_channel: ${{ steps.identity.outputs.release_channel }}
      publication_mode: ${{ steps.identity.outputs.publication_mode }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      make_latest: ${{ steps.identity.outputs.make_latest }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Rust for exact updater signature verification
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Resolve source identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! node --input-type=module -e \
            'import { isSemver } from "./scripts/release/lib.mjs"; process.exit(isSemver(process.argv[1]) ? 0 : 1)' \
            "${version}"; then
            printf 'Package version is not native-compatible numeric SemVer: %s\n' "${version}" >&2
            exit 1
          fi
          release_channel="$(node -p "require('./package.json').release.channel")"
          case "${release_channel}" in
            prerelease)
              prerelease="true"
              make_latest="false"
              ;;
            stable)
              prerelease="false"
              make_latest="true"
              ;;
            *)
              printf 'Package release channel is not prerelease or stable: %s\n' "${release_channel}" >&2
              exit 1
              ;;
          esac
          candidate_tag="v${version}"
          commit="$(git rev-parse HEAD)"
          event_commit="$(git rev-parse "${EVENT_SHA}^{commit}")"
          source_date="$(git show -s --format=%cI HEAD)"
          if [[ "${commit}" != "${event_commit}" ]]; then
            printf 'Checked-out commit %s differs from event commit %s.\n' "${commit}" "${event_commit}" >&2
            exit 1
          fi
          case "${EVENT_NAME}" in
            push)
              publication_mode="public-github-release"
              if [[ "${EVENT_REF}" != "refs/tags/${candidate_tag}" ]]; then
                printf 'Release tag %s does not exactly match candidate %s.\n' "${EVENT_REF}" "${candidate_tag}" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              publication_mode="commit-bound-qc"
              if [[ "${EVENT_REF}" != "refs/heads/main" ]]; then
                printf 'Release preflight must be dispatched from refs/heads/main, not %s.\n' "${EVENT_REF}" >&2
                exit 1
              fi
              ;;
            *)
              printf 'Unsupported release event: %s\n' "${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${candidate_tag}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${commit}" >> "${GITHUB_OUTPUT}"
          printf 'source_date=%s\n' "${source_date}" >> "${GITHUB_OUTPUT}"
          printf 'release_channel=%s\n' "${release_channel}" >> "${GITHUB_OUTPUT}"
          printf 'publication_mode=%s\n' "${publication_mode}" >> "${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${prerelease}" >> "${GITHUB_OUTPUT}"
          printf 'make_latest=%s\n' "${make_latest}" >> "${GITHUB_OUTPUT}"

      - name: Validate versions, workflow syntax, and action pins
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: node scripts/release/validate-release.mjs --tag "${RELEASE_TAG}"

      - name: Exercise release collection and finalization tooling
        run: npm run release:self-test

      - name: Test publication evidence verification
        run: npm run test:release-evidence

      - name: Test frontend security policy
        run: npm run test:frontend

  supply-chain:
    name: Generate SBOMs and notices
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0

      - name: Install locked dependency graph
        run: npm ci --ignore-scripts

      - name: Generate third-party and engine notices
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE: ${{ needs.validate.outputs.source_date }}
          PUBLICATION_MODE: ${{ needs.validate.outputs.publication_mode }}
        run: >-
          node scripts/release/generate-notices.mjs
          --out release-assets
          --version "${RELEASE_VERSION}"
          --tag "${RELEASE_TAG}"
          --commit "${SOURCE_COMMIT}"
          --source-date "${SOURCE_DATE}"
          --publication-mode "${PUBLICATION_MODE}"
          --repository "${GITHUB_REPOSITORY}"

      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/ai-security-scanner-${{ needs.validate.outputs.version }}.cyclonedx.json
          syft-version: v1.51.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/ai-security-scanner-${{ needs.validate.outputs.version }}.spdx.json
          syft-version: v1.51.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate honest release metadata
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PUBLICATION_MODE: ${{ needs.validate.outputs.publication_mode }}
        run: >-
          node scripts/release/validate-release.mjs
          --tag "${RELEASE_TAG}"
          --publication-mode "${PUBLICATION_MODE}"
          --metadata release-assets/release-metadata.json

      - name: Preserve supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.platform }} installers
    needs: validate
    # A failed platform produces no artifact for that platform. The finalizer
    # records it as unavailable instead of cancelling qualified siblings.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            rust_targets: x86_64-unknown-linux-gnu
            managed_runtime_target: x86_64-unknown-linux-gnu
            bundle_root: target/release/bundle
            egress_sidecar_path: src-tauri/binaries/ai-security-scanner-egress-gateway-x86_64-unknown-linux-gnu
            bootstrap_broker_path: src-tauri/binaries/ai-security-scanner-bootstrap-broker-x86_64-unknown-linux-gnu
            casework_cli_path: src-tauri/binaries/ai-security-scanner-cli-x86_64-unknown-linux-gnu
            expected: deb,rpm,appimage
          - platform: macos-universal
            runner: macos-14
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            managed_runtime_target: universal-apple-darwin
            bundle_root: target/universal-apple-darwin/release/bundle
            egress_sidecar_path: src-tauri/binaries/ai-security-scanner-egress-gateway-universal-apple-darwin
            bootstrap_broker_path: src-tauri/binaries/ai-security-scanner-bootstrap-broker-universal-apple-darwin
            casework_cli_path: src-tauri/binaries/ai-security-scanner-cli-universal-apple-darwin
            expected: dmg
          - platform: windows-x86_64
            runner: windows-2022
            rust_targets: x86_64-pc-windows-msvc
            managed_runtime_target: x86_64-pc-windows-msvc
            bundle_root: target/release/bundle
            egress_sidecar_path: src-tauri/binaries/ai-security-scanner-egress-gateway-x86_64-pc-windows-msvc.exe
            bootstrap_broker_path: src-tauri/binaries/ai-security-scanner-bootstrap-broker-x86_64-pc-windows-msvc.exe
            casework_cli_path: src-tauri/binaries/ai-security-scanner-cli-x86_64-pc-windows-msvc.exe
            expected: nsis,msi
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: release-${{ matrix.platform }}

      - name: Install Linux bundler dependencies
        if: matrix.platform == 'linux-x86_64'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential
          curl
          desktop-file-utils
          file
          libayatana-appindicator3-dev
          libdbus-1-dev
          libfuse2t64
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          patchelf
          pkg-config
          rpm
          wget
          xvfb

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build and stage the Linux managed egress sidecar
        if: matrix.platform == 'linux-x86_64'
        run: npm run desktop:prepare-sidecar -- --target x86_64-unknown-linux-gnu

      - name: Build and stage the universal macOS managed egress sidecar
        if: matrix.platform == 'macos-universal'
        run: npm run desktop:prepare-sidecar -- --target universal-apple-darwin

      - name: Build and stage the Windows managed egress sidecar
        if: matrix.platform == 'windows-x86_64'
        run: npm run desktop:prepare-sidecar -- --target x86_64-pc-windows-msvc

      - name: Verify, build, and stage the release-managed local runtime
        shell: bash
        run: >-
          node runtime/vendor-managed-runtime.mjs
          --target "${{ matrix.managed_runtime_target }}"
          --output runtime/staged/managed-runtime

      - name: Build the application once without installers
        id: build_unbundled
        shell: bash
        env:
          NO_STRIP: "true"
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          arguments=(--ci --verbose --no-bundle)
          if [[ "${RELEASE_PLATFORM}" == "macos-universal" ]]; then
            arguments+=(--target universal-apple-darwin)
          fi
          npm run tauri build -- "${arguments[@]}" -- --locked

      - name: Bundle the Debian installer independently
        id: bundle_deb
        if: matrix.platform == 'linux-x86_64' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        env:
          NO_STRIP: "true"
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles deb
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Bundle the RPM installer independently
        id: bundle_rpm
        if: matrix.platform == 'linux-x86_64' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        env:
          NO_STRIP: "true"
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles rpm
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Bundle the AppImage installer with an optional updater
        id: bundle_appimage
        if: matrix.platform == 'linux-x86_64' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        env:
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles appimage
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Bundle the macOS app and DMG with an optional updater
        id: bundle_macos
        if: matrix.platform == 'macos-universal' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles app,dmg
          --target universal-apple-darwin
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Bundle the Windows NSIS installer with an optional updater
        id: bundle_nsis
        if: matrix.platform == 'windows-x86_64' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles nsis
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Bundle the Windows MSI installer independently
        id: bundle_msi
        if: matrix.platform == 'windows-x86_64' && steps.build_unbundled.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/release/bundle-with-optional-updater.mjs
          --bundles msi
          --bundle-root "${{ matrix.bundle_root }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Determine which requested installer siblings actually finished
        id: available_bundles
        if: always() && steps.build_unbundled.outcome == 'success'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          DEB_OUTCOME: ${{ steps.bundle_deb.outcome }}
          RPM_OUTCOME: ${{ steps.bundle_rpm.outcome }}
          APPIMAGE_OUTCOME: ${{ steps.bundle_appimage.outcome }}
          MACOS_OUTCOME: ${{ steps.bundle_macos.outcome }}
          NSIS_OUTCOME: ${{ steps.bundle_nsis.outcome }}
          MSI_OUTCOME: ${{ steps.bundle_msi.outcome }}
        run: |
          set -euo pipefail
          available=()
          case "${RELEASE_PLATFORM}" in
            linux-x86_64)
              if [[ "${DEB_OUTCOME}" == "success" ]]; then available+=(deb); fi
              if [[ "${RPM_OUTCOME}" == "success" ]]; then available+=(rpm); fi
              if [[ "${APPIMAGE_OUTCOME}" == "success" ]]; then available+=(appimage); fi
              ;;
            macos-universal)
              if [[ "${MACOS_OUTCOME}" == "success" ]]; then available+=(dmg); fi
              ;;
            windows-x86_64)
              if [[ "${NSIS_OUTCOME}" == "success" ]]; then available+=(nsis); fi
              if [[ "${MSI_OUTCOME}" == "success" ]]; then available+=(msi); fi
              ;;
            *)
              printf 'Unsupported platform: %s\n' "${RELEASE_PLATFORM}" >&2
              exit 1
              ;;
          esac
          if [[ "${#available[@]}" -eq 0 ]]; then
            printf 'No requested installer sibling completed for %s.\n' "${RELEASE_PLATFORM}" >&2
            exit 1
          fi
          joined="$(IFS=,; printf '%s' "${available[*]}")"
          printf 'available=%s\n' "${joined}" >> "${GITHUB_OUTPUT}"

      - name: Collect only successful installers and platform checksums
        id: collect_bundles
        if: always() && steps.available_bundles.outcome == 'success'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          BUNDLE_ROOT: ${{ matrix.bundle_root }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_BUNDLES: ${{ matrix.expected }}
          AVAILABLE_BUNDLES: ${{ steps.available_bundles.outputs.available }}
          EGRESS_SIDECAR_PATH: ${{ matrix.egress_sidecar_path }}
          BOOTSTRAP_BROKER_PATH: ${{ matrix.bootstrap_broker_path }}
          CASEWORK_CLI_PATH: ${{ matrix.casework_cli_path }}
        run: >-
          node scripts/release/collect-bundles.mjs
          --bundle-root "${BUNDLE_ROOT}"
          --out release-assets
          --platform "${RELEASE_PLATFORM}"
          --expect "${EXPECTED_BUNDLES}"
          --available "${AVAILABLE_BUNDLES}"
          --egress-sidecar "${EGRESS_SIDECAR_PATH}"
          --bootstrap-broker "${BOOTSTRAP_BROKER_PATH}"
          --casework-cli "${CASEWORK_CLI_PATH}"
          --version "${RELEASE_VERSION}"
          --tag "${RELEASE_TAG}"
          --commit "${SOURCE_COMMIT}"

      - name: Generate exact managed runtime manifest, SBOM, notices, and source evidence
        if: steps.collect_bundles.outcome == 'success'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          runtime_evidence_args=(
            --manifest runtime/staged/managed-runtime/manifest.json
            --out release-assets
            --platform "${RELEASE_PLATFORM}"
          )
          if [[ "${RELEASE_PLATFORM}" == "windows-x86_64" ]]; then
            runtime_evidence_args+=(
              --expected-manifest-sha256 a8112473e5d87655e6145ea5f6cff569c872329d2ec14bfb9463078abcb60e3a
            )
          fi
          node scripts/release/generate-runtime-evidence.mjs "${runtime_evidence_args[@]}"

      - name: Preserve platform installers
        if: steps.collect_bundles.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  qualification:
    name: Qualify installed ${{ matrix.platform }} artifact on a fresh hosted runner
    needs: [validate, build]
    # Qualification remains fail-closed for this exact installer: no evidence
    # means it is excluded. It is not a verdict on another platform.
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            qualification_id: linux-x86_64-deb
            installer_type: deb
          - platform: macos-universal
            runner: macos-15-intel
            qualification_id: macos-universal-dmg
            installer_type: dmg
          - platform: windows-x86_64
            runner: windows-2025
            qualification_id: windows-x86_64-msi
            installer_type: msi
          - platform: windows-x86_64
            runner: windows-2025
            qualification_id: windows-x86_64-nsis
            installer_type: nsis
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the evidence generator
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Download the independently built platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: release-input

      - name: Independently install and qualify the Debian package
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: >-
          scripts/release/qualify-linux.sh
          release-input
          "${RUNNER_TEMP}/ai-security-scanner-platform-qualification-evidence"

      - name: Independently install and qualify the macOS DMG
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: >-
          scripts/release/qualify-macos.sh
          release-input
          "${RUNNER_TEMP}/ai-security-scanner-platform-qualification-evidence"

      - name: Independently install and qualify the Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: >-
          scripts/release/qualify-windows.ps1
          -ArtifactDirectory release-input
          -WorkDirectory "$env:RUNNER_TEMP/ai-security-scanner-platform-qualification-evidence"
          -InstallerType "${{ matrix.installer_type }}"

      - name: Create and fail-closed validate platform qualification evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.release_channel }}
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          evidence="qualification-evidence/platform-qualification-${{ matrix.qualification_id }}.json"
          node scripts/release/platform-qualification.mjs create \
            --artifact-dir release-input \
            --observations "${RUNNER_TEMP}/ai-security-scanner-platform-qualification-evidence/observations.json" \
            --out "${evidence}" \
            --platform "${{ matrix.platform }}" \
            --installer-type "${{ matrix.installer_type }}" \
            --runner-label "${{ matrix.runner }}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --commit "${SOURCE_COMMIT}" \
            --release-channel "${RELEASE_CHANNEL}"
          node scripts/release/platform-qualification.mjs validate \
            --file "${evidence}" \
            --artifact-dir release-input \
            --platform "${{ matrix.platform }}" \
            --installer-type "${{ matrix.installer_type }}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --commit "${SOURCE_COMMIT}" \
            --release-channel "${RELEASE_CHANNEL}"

      - name: Preserve strict platform qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-qualification-${{ matrix.qualification_id }}
          path: qualification-evidence/platform-qualification-${{ matrix.qualification_id }}.json
          if-no-files-found: error
          retention-days: 14

  windows-nsis-supporting-data-preservation:
    name: Optional Windows NSIS ${{ matrix.scenario }} data-preservation fixture
    if: github.event_name == 'workflow_dispatch' && inputs.windows_data_preservation == true
    needs: [validate, build]
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: n-minus-one-upgrade
            fixture_script: scripts/release/qualify-windows-nsis-upgrade.ps1
            evidence_script: scripts/release/windows-nsis-upgrade-evidence.mjs
            work_name: ai-security-scanner-nsis-upgrade-evidence
          - scenario: ghost-repair-uninstall
            fixture_script: scripts/release/qualify-windows-nsis-ghost-recovery.ps1
            evidence_script: scripts/release/windows-nsis-ghost-recovery-evidence.mjs
            work_name: ai-security-scanner-nsis-ghost-recovery-evidence
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out the exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the evidence generator
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Download the independently built Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-installers-windows-x86_64
          path: release-input

      - name: Run the explicitly requested supporting fixture
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "${{ matrix.work_name }}"
          & "${{ matrix.fixture_script }}" `
            -ArtifactDirectory release-input `
            -WorkDirectory $work `
            -CurrentVersion $env:RELEASE_VERSION

      - name: Create and revalidate fixture-scoped evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "${{ matrix.work_name }}"
          $root = Join-Path $PWD "supporting-evidence/windows-nsis-data-preservation/${{ matrix.scenario }}"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $report = Join-Path $root "beginner-report.html"
          $evidence = Join-Path $root "evidence.json"
          Copy-Item -LiteralPath (Join-Path $work "beginner-report.html") -Destination $report
          & node "${{ matrix.evidence_script }}" create `
            --artifact-dir release-input `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG `
            --commit $env:SOURCE_COMMIT `
            --beginner-report $report `
            --observations (Join-Path $work "observations.json") `
            --out $evidence
          & node "${{ matrix.evidence_script }}" validate `
            --file $evidence `
            --artifact-dir release-input `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG `
            --commit $env:SOURCE_COMMIT `
            --beginner-report $report

      - name: Preserve explicitly requested supporting evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nsis-supporting-data-preservation-${{ matrix.scenario }}
          path: supporting-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  finalize-supported-artifacts:
    name: Finalize and verify independently supported artifacts
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs['supply-chain'].result == 'success'
    needs:
      - validate
      - supply-chain
      - build
      - qualification
      - windows-nsis-supporting-data-preservation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Rust for exact updater signature verification
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Download supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-supply-chain
          path: assembled-input

      - name: Download every platform artifact that finished successfully
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-installers-*
          path: assembled-input
          merge-multiple: true

      - name: Download every artifact qualification that finished successfully
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-qualification-*
          path: assembled-input
          merge-multiple: true

      - name: Optionally download requested Windows data-preservation fixtures
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-nsis-supporting-data-preservation-*
          path: assembled-input
          merge-multiple: true

      - name: Select supported installers and create a clean release index
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_MODE: ${{ needs.validate.outputs.publication_mode }}
        run: >-
          node scripts/release/finalize-release.mjs
          --input assembled-input
          --out release-assets
          --version "${RELEASE_VERSION}"
          --tag "${RELEASE_TAG}"
          --commit "${SOURCE_COMMIT}"
          --publication-mode "${PUBLICATION_MODE}"

      - name: Verify finalized checksums and release index
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_MODE: ${{ needs.validate.outputs.publication_mode }}
        run: >-
          node scripts/release/verify-finalized-release.mjs
          --dir release-assets
          --version "${RELEASE_VERSION}"
          --tag "${RELEASE_TAG}"
          --commit "${SOURCE_COMMIT}"
          --publication-mode "${PUBLICATION_MODE}"

      - name: Preserve the finalized release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-finalized
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Attest and publish supported artifacts
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs['finalize-supported-artifacts'].result == 'success' &&
      github.event_name == 'push' &&
      github.ref == format('refs/tags/{0}', needs.validate.outputs.tag)
    needs: [validate, finalize-supported-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Download the finalized release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-finalized
          path: release-assets

      - name: Reverify finalized checksums and release index
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          PUBLICATION_MODE: ${{ needs.validate.outputs.publication_mode }}
        run: >-
          node scripts/release/verify-finalized-release.mjs
          --dir release-assets
          --version "${RELEASE_VERSION}"
          --tag "${RELEASE_TAG}"
          --commit "${SOURCE_COMMIT}"
          --publication-mode "${PUBLICATION_MODE}"

      - name: Attest every published file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**/*

      - name: Publish the non-draft public release with the declared channel
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          name: ai-security-scanner ${{ needs.validate.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: release-assets/**/*
