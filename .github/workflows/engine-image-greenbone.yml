name: Publish managed Greenbone engine image

on:
  push:
    branches:
      - main
    paths:
      - engines/images/greenbone/**
      - '!engines/images/greenbone/plan.json'
      - engines/images/greenbone-launcher/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: engine-image-greenbone-23.50.21-feed202608240615-1
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-greenbone
  IMAGE_TAG: 23.50.21-feed202608240615-1
  SOURCE_DATE_EPOCH: "1787573675"
  SCANNER_REVISION: c3ae607ef632393b7919fb179d30b940d929f713
  FEED_REVISION: b26d7237d56b7cf85e6ace2b9351e7851461b3a8
  NOTUS_REVISION: 4635b37aecd2d968680c7609a7fb61e5d780ce93

jobs:
  guard:
    name: Guard the immutable managed version tag
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
      should_build: ${{ steps.guard.outputs.should_build }}
      digest: ${{ steps.guard.outputs.digest }}
      candidate_tag: ${{ steps.guard.outputs.candidate_tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the version before any native build
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  native:
    name: Native build and real smoke (${{ matrix.platform }})
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify and reclaim ephemeral hosted-runner space
        shell: bash
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          df -h /
          available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if (( available_kib < 31457280 )); then
            test "${RUNNER_ENVIRONMENT}" = "github-hosted"
            for runner_path in /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc; do
              if [[ -e "${runner_path}" ]]; then
                sudo rm -rf -- "${runner_path}"
              fi
            done
            sudo apt-get clean
            docker system prune --all --force
          fi
          df -h /
          test "$(df -Pk / | awk 'NR == 2 {print $4}')" -ge 15728640

      - name: Install the pinned Rust toolchain for the managed gateway
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version | grep -Fq 'rustc 1.98.0'

      - name: Build and test the managed egress gateway
        shell: bash
        run: >-
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          --no-default-features --features egress-gateway
          --bin ai-security-scanner-egress-gateway

      - name: Set up Docker Buildx without emulation
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build the native image and export its complete cache
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: engines/images/greenbone/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          push: false
          load: true
          tags: greenbone-native:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=engine-greenbone-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=engine-greenbone-${{ matrix.architecture }}

      - name: Inspect the locally loaded native image
        shell: bash
        run: |
          native_image="greenbone-native:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.architecture }}"
          test "$(docker image inspect "${native_image}" --format '{{.Architecture}}')" = "${{ matrix.architecture }}"
          test "$(docker image inspect "${native_image}" --format '{{.Os}}')" = linux
          docker image inspect "${native_image}" > greenbone-native-inspect.json

      - name: Run the real managed-SOCKS NVT and adapter smoke
        id: smoke
        shell: bash
        run: |
          native_image="greenbone-native:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.architecture }}"
          KEEP_GREENBONE_SMOKE=1 \
            engines/images/greenbone/managed-socks-smoke.sh \
            "${native_image}" \
            "${GITHUB_WORKSPACE}/target/debug/ai-security-scanner-egress-gateway" \
            adapter 2>&1 | tee greenbone-native-smoke.log
          artifact_dir="$(sed -n 's/^preserved Greenbone smoke artifacts at //p' greenbone-native-smoke.log | tail -1)"
          test -n "${artifact_dir}"
          test -s "${artifact_dir}/output/greenbone.xml"
          grep -Fq 'xml_results=5 actionable_alarms=1' greenbone-native-smoke.log
          grep -Fq '"finding_count":1' greenbone-native-smoke.log
          grep -Fq '"warnings":[]' greenbone-native-smoke.log
          evidence_dir="package-evidence/native-${{ matrix.architecture }}"
          mkdir -p "${evidence_dir}"
          cp "${artifact_dir}/output/greenbone.xml" "${evidence_dir}/greenbone.xml"
          cp "${artifact_dir}/gateway.log" "${evidence_dir}/gateway.log"
          cp greenbone-native-smoke.log "${evidence_dir}/smoke.log"
          xml_sha256="$(sha256sum "${evidence_dir}/greenbone.xml" | cut -d ' ' -f 1)"
          jq -n \
            --slurpfile inspect greenbone-native-inspect.json \
            --arg platform "${{ matrix.platform }}" \
            --arg xml_sha256 "sha256:${xml_sha256}" \
            --arg source_revision "${GITHUB_SHA}" \
            '($inspect[0][0]) as $image | {schemaVersion: 1, platform: $platform, sourceRevision: $source_revision, imageIdentity: {id: $image.Id, architecture: $image.Architecture, os: $image.Os, rootFsDiffIds: $image.RootFS.Layers, config: $image.Config}, realScan: {selectedOid: "1.3.6.1.4.1.25623.1.0.108252", xmlResults: 5, actionableAlarms: 1, adapterFindings: 1, xmlSha256: $xml_sha256, directEgressDenied: true, unauthorizedPortDenied: true}}' \
            > "${evidence_dir}/native-digest.json"

      - name: Authenticate the smoke-tested native publisher
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact smoke-tested native image
        shell: bash
        run: |
          architecture="${{ matrix.architecture }}"
          native_image="greenbone-native:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}"
          staging_tag="native-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}"
          staging_ref="${IMAGE}:${staging_tag}"
          docker tag "${native_image}" "${staging_ref}"
          docker push "${staging_ref}"
          published_digest="$(
            docker buildx imagetools inspect "${staging_ref}" --format '{{json .Manifest.Digest}}' |
              jq -er 'select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          evidence="package-evidence/native-${architecture}/native-digest.json"
          jq \
            --arg repository "${IMAGE}" \
            --arg tag "${staging_tag}" \
            --arg digest "${published_digest}" \
            '.publishedImage = {repository: $repository, tag: $tag, digest: $digest}' \
            "${evidence}" > "${evidence}.tmp"
          mv "${evidence}.tmp" "${evidence}"

      - name: Upload native digest and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greenbone-native-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence/native-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish pinned native manifests and preserve evidence
    needs:
      - guard
      - native
    if: always() && needs.guard.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download amd64 native evidence
        if: needs.guard.outputs.should_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: greenbone-native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/amd64

      - name: Download arm64 native evidence
        if: needs.guard.outputs.should_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: greenbone-native-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/arm64

      - name: Verify native evidence identities
        if: needs.guard.outputs.should_build == 'true'
        shell: bash
        run: |
          for architecture in amd64 arm64; do
            evidence="native-evidence/${architecture}/native-digest.json"
            expected_tag="native-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${architecture}"
            jq -e --arg platform "linux/${architecture}" --arg revision "${GITHUB_SHA}" --arg architecture "${architecture}" --arg tag "${expected_tag}" \
              '.schemaVersion == 1 and .platform == $platform and .sourceRevision == $revision and (.imageIdentity.id | test("^sha256:[0-9a-f]{64}$")) and .imageIdentity.architecture == $architecture and .imageIdentity.os == "linux" and (.imageIdentity.rootFsDiffIds | length > 0) and (.imageIdentity.config | type == "object") and .publishedImage.repository == "ghcr.io/teddashh/ai-security-scanner-engine-greenbone" and .publishedImage.tag == $tag and (.publishedImage.digest | test("^sha256:[0-9a-f]{64}$")) and .realScan.actionableAlarms == 1 and .realScan.adapterFindings == 1' \
              "${evidence}"
          done

      - name: Verify and reclaim ephemeral hosted-runner space
        shell: bash
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          df -h /
          available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if (( available_kib < 20971520 )); then
            test "${RUNNER_ENVIRONMENT}" = "github-hosted"
            for runner_path in /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc; do
              if [[ -e "${runner_path}" ]]; then
                sudo rm -rf -- "${runner_path}"
              fi
            done
            sudo apt-get clean
            docker system prune --all --force
          fi
          df -h /
          test "$(df -Pk / | awk 'NR == 2 {print $4}')" -ge 10485760

      - name: Install the pinned Rust toolchain for final anonymous smoke
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features egress-gateway \
            --bin ai-security-scanner-egress-gateway

      - name: Set up Docker Buildx without emulation
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the exact smoke-tested native candidate index
        id: publish
        if: needs.guard.outputs.should_build == 'true'
        shell: bash
        run: |
          amd64_digest="$(jq -er '.publishedImage.digest | select(test("^sha256:[0-9a-f]{64}$"))' native-evidence/amd64/native-digest.json)"
          arm64_digest="$(jq -er '.publishedImage.digest | select(test("^sha256:[0-9a-f]{64}$"))' native-evidence/arm64/native-digest.json)"
          test "${amd64_digest}" != "${arm64_digest}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ needs.guard.outputs.candidate_tag }}" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"
          index_digest="$(
            docker buildx imagetools inspect "${IMAGE}:${{ needs.guard.outputs.candidate_tag }}" --format '{{json .Manifest.Digest}}' |
              jq -er 'select(test("^sha256:[0-9a-f]{64}$"))'
          )"
          docker buildx imagetools inspect "${IMAGE}@${index_digest}" --raw > promoted-index.json
          jq -e \
            --arg amd64 "${amd64_digest}" \
            --arg arm64 "${arm64_digest}" \
            '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] == [$amd64]) and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] == [$arm64]) and (.manifests | length == 2)' \
            promoted-index.json
          printf 'digest=%s\n' "${index_digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish anonymous pull access
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Anonymously inspect, pull, and real-smoke the final digest
        id: anonymous
        shell: bash
        env:
          INDEX_DIGEST: ${{ needs.guard.outputs.digest || steps.publish.outputs.digest }}
          SHOULD_BUILD: ${{ needs.guard.outputs.should_build }}
        run: |
          [[ "${INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p package-evidence
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --raw > package-evidence/greenbone-index.json
          final_amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' package-evidence/greenbone-index.json)"
          final_arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' package-evidence/greenbone-index.json)"
          for platform in amd64 arm64; do
            final_variable="final_${platform}_digest"
            final_digest="${!final_variable}"
            docker pull --platform "linux/${platform}" "${IMAGE}@${final_digest}"
            docker image inspect "${IMAGE}@${final_digest}" > "${RUNNER_TEMP}/final-${platform}-inspect.json"
            docker buildx imagetools inspect "${IMAGE}@${final_digest}" --raw > "${RUNNER_TEMP}/final-${platform}-manifest.json"
            if [ "${SHOULD_BUILD}" = true ]; then
              jq -e \
                --arg final_digest "${final_digest}" \
                --slurpfile final "${RUNNER_TEMP}/final-${platform}-inspect.json" \
                --slurpfile manifest "${RUNNER_TEMP}/final-${platform}-manifest.json" \
                '($final[0][0]) as $image | ($manifest[0]) as $registry | .publishedImage.digest == $final_digest and .imageIdentity.id == $registry.config.digest and .imageIdentity.architecture == $image.Architecture and .imageIdentity.os == $image.Os and .imageIdentity.rootFsDiffIds == $image.RootFS.Layers and (.imageIdentity.config | {User, Env, Cmd, ArgsEscaped, Volumes, WorkingDir, Entrypoint, Labels}) == ($image.Config | {User, Env, Cmd, ArgsEscaped, Volumes, WorkingDir, Entrypoint, Labels})' \
                "native-evidence/${platform}/native-digest.json"
            fi
          done
          test "$(docker image inspect "${IMAGE}@${final_amd64_digest}" --format '{{.Config.User}}')" = '65532:65532'
          KEEP_GREENBONE_SMOKE=1 \
            engines/images/greenbone/managed-socks-smoke.sh \
            "${IMAGE}@${final_amd64_digest}" \
            "${GITHUB_WORKSPACE}/target/debug/ai-security-scanner-egress-gateway" \
            adapter 2>&1 | tee package-evidence/greenbone-anonymous-smoke.log
          artifact_dir="$(sed -n 's/^preserved Greenbone smoke artifacts at //p' package-evidence/greenbone-anonymous-smoke.log | tail -1)"
          test -n "${artifact_dir}"
          cp "${artifact_dir}/output/greenbone.xml" package-evidence/greenbone-anonymous-smoke.xml
          grep -Fq 'xml_results=5 actionable_alarms=1' package-evidence/greenbone-anonymous-smoke.log
          grep -Fq '"finding_count":1' package-evidence/greenbone-anonymous-smoke.log
          grep -Fq '"warnings":[]' package-evidence/greenbone-anonymous-smoke.log
          xml_sha256="$(sha256sum package-evidence/greenbone-anonymous-smoke.xml | cut -d ' ' -f 1)"
          jq -n \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg index_digest "${INDEX_DIGEST}" \
            --arg amd64_digest "${final_amd64_digest}" \
            --arg arm64_digest "${final_arm64_digest}" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg source_date_epoch "${SOURCE_DATE_EPOCH}" \
            --arg scanner_revision "${SCANNER_REVISION}" \
            --arg feed_revision "${FEED_REVISION}" \
            --arg notus_revision "${NOTUS_REVISION}" \
            --arg xml_sha256 "sha256:${xml_sha256}" \
            --argjson native_identity_matches "${SHOULD_BUILD}" \
            '{schemaVersion: 1, engine: "greenbone", image: $image, tag: $tag, digest: $index_digest, indexDigest: $index_digest, platformDigests: {"linux/amd64": $amd64_digest, "linux/arm64": $arm64_digest}, sourceRevision: $source_revision, sourceDateEpoch: $source_date_epoch, public: true, anonymousPullVerified: true, managedSmokeEvidenceSha256: $xml_sha256, nativeImageIdentityMatchesFinal: $native_identity_matches, reusedSignedIndex: ($native_identity_matches | not), upstream: {scannerRevision: $scanner_revision, scannerSourceSha256: "47cbc7fbff0e19c4533f48c6e7287298f1466d1556f0fc4a7177c37506a3d5e8", feedRevision: $feed_revision, feedVersion: "202608240615-community", notusRevision: $notus_revision}, managedProxy: {kind: "socks5h", directEgressDenied: true, unauthorizedPortDenied: true}, realScan: {selectedOid: "1.3.6.1.4.1.25623.1.0.108252", authorizedTarget: "172.29.251.10:8080/tcp", xmlResults: 5, actionableAlarms: 1, adapterFindings: 1, adapterWarnings: 0, xmlSha256: $xml_sha256}}' \
            > package-evidence/greenbone-image-manifest.json
          printf 'amd64_digest=%s\n' "${final_amd64_digest}" >> "${GITHUB_OUTPUT}"
          printf 'arm64_digest=%s\n' "${final_arm64_digest}" >> "${GITHUB_OUTPUT}"
          printf 'xml_sha256=sha256:%s\n' "${xml_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Preserve publication evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          engine: greenbone
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ needs.guard.outputs.digest || steps.publish.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ needs.guard.outputs.digest || steps.publish.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        shell: bash
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Record the released index and smoke evidence
        shell: bash
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          XML_SHA256: ${{ steps.anonymous.outputs.xml_sha256 }}
        run: |
          printf 'Published `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'Anonymous real-scan XML: `%s`\n' "${XML_SHA256}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greenbone-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
