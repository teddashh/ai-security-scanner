name: Publish managed Microsoft 365 engine images

on:
  push:
    branches:
      - main
    paths:
      - engines/images/m365-launcher/**
      - engines/images/scubagear/**
      - "!engines/images/scubagear/plan.json"
      - engines/images/maester/**
      - "!engines/images/maester/plan.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-m365-engine-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.engine }} for amd64 + arm64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: scubagear
            tag: 1.8.0-3
            dockerfile: engines/images/scubagear/Dockerfile
            expected_version: 1.8.0
          - engine: maester
            tag: 2.0.0-3
            dockerfile: engines/images/maester/Dockerfile
            expected_version: 2.0.0
    env:
      IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-${{ matrix.engine }}
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the shared launcher in the pinned toolchain
        run: |
          docker run --rm \
            -v "${PWD}/engines/images/m365-launcher:/src:ro" \
            -w /src \
            golang:1.25.0-alpine3.22@sha256:f18a072054848d87a8077455f0ac8a25886f2397f88bfdd222d6fafbb5bba440 \
            sh -ceu 'test -z "$(gofmt -d main.go main_test.go)"; go test ./...'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=engine-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=engine-${{ matrix.engine }}

      - name: Publish anonymous pull access
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Verify anonymous multi-platform access
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' <<<"${manifest}"

      - name: Run the anonymous amd64 smoke contract
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          user="$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Config.User}}')"
          entrypoint="$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{join .Config.Entrypoint " "}}')"
          test "${user}" = "65532:65532"
          test "${entrypoint}" = "/usr/local/bin/ai-security-scanner-m365-launcher"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT
          mkdir -p \
            "${smoke_root}/missing-output-control" \
            "${smoke_root}/missing-scope-control" \
            "${smoke_root}/missing-credentials-control" \
            "${smoke_root}/output"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          expiry="$(date -u -d '+30 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg now "${now}" \
            '{schema_version: "1", engine_id: $engine, generated_at: $now, assets: [{id: "publication-smoke-tenant", name: "Publication smoke tenant", kind: "tenant", provider: "microsoft365", region: null, identifiers: [{namespace: "microsoft365_tenant_id", value: "11111111-1111-4111-8111-111111111111"}], grants: [{id: "publication-smoke-inventory", permission: "inventory_read", confirmed_by: "publication-smoke", confirmed_at: $now, expires_at: null, authorization_reference: null, external_scope: null}, {id: "publication-smoke-configuration", permission: "configuration_read", confirmed_by: "publication-smoke", confirmed_at: $now, expires_at: null, authorization_reference: null, external_scope: null}]}]}' \
            > "${smoke_root}/scope.json"
          jq -n \
            --arg expiry "${expiry}" \
            '{schema_version: "1.0.0", credentials: [{key: "MSGRAPH_ACCESS_TOKEN", value: "publication-smoke-not-a-real-token", expires_at: $expiry, source: "external_read_only_grant"}]}' \
            > "${smoke_root}/credentials.json"
          cp "${smoke_root}/scope.json" "${smoke_root}/missing-output-control/scope.json"
          cp "${smoke_root}/credentials.json" "${smoke_root}/missing-output-control/credentials.json"
          cp "${smoke_root}/credentials.json" "${smoke_root}/missing-scope-control/credentials.json"
          cp "${smoke_root}/scope.json" "${smoke_root}/missing-credentials-control/scope.json"
          chmod 0555 "${smoke_root}"/*-control
          chmod 0444 "${smoke_root}"/*-control/*.json
          chmod 0777 "${smoke_root}/output"

          expect_missing_mount_rejected() {
            case_name="$1"
            expected_error="$2"
            control_directory="$3"
            shift 3
            if timeout 30s docker run --rm --platform linux/amd64 --read-only --cap-drop=ALL --network=none \
                --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m \
                --mount "type=bind,source=${control_directory},target=/run/ai-security-scanner,readonly" \
                "$@" \
                "${IMAGE}@${DIGEST}" \
                --engine "${{ matrix.engine }}" \
                --scope /run/ai-security-scanner/scope.json \
                --output /output >"launcher-${case_name}.log" 2>&1; then
              echo "launcher unexpectedly accepted missing ${case_name} mount" >&2
              exit 1
            fi
            grep -F "microsoft 365 engine launcher: ${expected_error}" "launcher-${case_name}.log"
          }

          expect_missing_mount_rejected \
            output "inspect evidence output:" "${smoke_root}/missing-output-control"
          expect_missing_mount_rejected \
            scope "read immutable scope:" "${smoke_root}/missing-scope-control" \
            --mount "type=bind,source=${smoke_root}/output,target=/output"
          expect_missing_mount_rejected \
            credentials "read protected credential channel:" "${smoke_root}/missing-credentials-control" \
            --mount "type=bind,source=${smoke_root}/output,target=/output"
          docker run --rm --platform linux/amd64 --entrypoint /opt/microsoft/powershell/7/pwsh \
            "${IMAGE}@${DIGEST}" -NoLogo -NoProfile -NonInteractive -Command \
            '$files=@(Get-ChildItem -LiteralPath "/usr/share/licenses/${{ matrix.engine }}" -File -ErrorAction Stop); if ($files.Count -lt 5) { throw "dependency notices are incomplete" }; $lock=Get-Content -LiteralPath /opt/ai-security-scanner/dependencies.lock.json -Raw | ConvertFrom-Json; if ($lock.source.module_version -ne "${{ matrix.expected_version }}") { throw "engine lock version mismatch" }'

      - name: Record publication and smoke evidence
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${manifest}")"
          mkdir -p package-evidence
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg revision "${REVISION}" \
            --arg amd64Digest "${amd64_digest}" \
            --arg arm64Digest "${arm64_digest}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platforms: ["linux/amd64", "linux/arm64"], platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, public: true, anonymousPullVerified: true, smoke: {platform: "linux/amd64", nonRoot: true, fixedEntrypoint: true, missingOutputMountRejected: true, missingScopeMountRejected: true, missingCredentialMountRejected: true, moduleLockVerified: true, dependencyNoticesVerified: true}}' \
            > "package-evidence/${{ matrix.engine }}-image-manifest.json"
          printf 'Published and anonymously verified `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve publication evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          engine: ${{ matrix.engine }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Seal the downloadable evidence inventory
        run: |
          set -o pipefail
          (
            cd package-evidence
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.engine }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
