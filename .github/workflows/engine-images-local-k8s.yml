name: Publish managed local and Kubernetes engine images

on:
  push:
    branches:
      - main
    paths:
      - engines/images/local-launcher/**
      - engines/images/semgrep/**
      - '!engines/images/semgrep/plan.json'
      - engines/images/trufflehog/**
      - '!engines/images/trufflehog/plan.json'
      - engines/images/trivy/**
      - '!engines/images/trivy/plan.json'
      - engines/images/grype/**
      - '!engines/images/grype/plan.json'
      - engines/images/kubescape/**
      - '!engines/images/kubescape/plan.json'
      - engines/images/kube-bench/**
      - '!engines/images/kube-bench/plan.json'
      - scripts/generate-oci-layout-fixture.mjs
      - scripts/prepare-offline-engine-data.mjs
      - scripts/select-local-engine-publication.mjs
  workflow_dispatch:
    inputs:
      engine:
        description: One engine to verify or publish
        type: choice
        required: true
        default: semgrep
        options: [semgrep, trufflehog, trivy, grype, kubescape, kube-bench]
      mode:
        description: Verification builds locally on runners without publishing an image
        type: choice
        required: true
        default: verify
        options: [verify, publish]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-local-k8s-engine-images
  cancel-in-progress: false

env:
  LOCAL_ENGINE_MATRIX: >-
    [{"engine":"semgrep","tag":"1.174.0-4","version":"1.174.0","version_args":"--version","dockerfile":"engines/images/semgrep/Dockerfile","workspace":"engines/images/semgrep/testdata/combination-review","output_file":"semgrep.json","output_kind":"json","offline_data":"semgrep"},{"engine":"trufflehog","tag":"3.97.0-3","version":"3.97.0","version_args":"--version","dockerfile":"engines/images/trufflehog/Dockerfile","workspace":"engines/images/trufflehog/testdata","output_file":"trufflehog.jsonl","output_kind":"jsonl","offline_data":"none"},{"engine":"trivy","tag":"0.74.0-4","version":"0.74.0","version_args":"--version","dockerfile":"engines/images/trivy/Dockerfile","workspace":"engines/images/local-launcher/testdata/oci-layout","output_file":"trivy.json","output_kind":"json","offline_data":"trivy"},{"engine":"grype","tag":"0.117.0-4","version":"0.117.0","version_args":"version","dockerfile":"engines/images/grype/Dockerfile","workspace":"engines/images/local-launcher/testdata/oci-layout","output_file":"grype.json","output_kind":"json","offline_data":"grype"},{"engine":"kubescape","tag":"4.0.12-3","version":"4.0.12","version_args":"version","dockerfile":"engines/images/kubescape/Dockerfile","workspace":"engines/images/kubescape/testdata","output_file":"kubescape.json","output_kind":"json","offline_data":"none"},{"engine":"kube-bench","tag":"0.16.0-4","version":"0.16.0","version_args":"version","dockerfile":"engines/images/kube-bench/Dockerfile","workspace":"engines/images/kube-bench/testdata","output_file":"kube-bench.json","output_kind":"json","offline_data":"none"}]

jobs:
  changes:
    name: Select explicitly versioned engine updates
    runs-on: ubuntu-24.04
    outputs:
      engines: ${{ steps.select.outputs.engines }}
      matrix: ${{ steps.select.outputs.matrix }}
      has_engines: ${{ steps.select.outputs.has_engines }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select new tags or one manually requested engine
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENGINE: ${{ inputs.engine }}
        run: node scripts/select-local-engine-publication.mjs
  launcher-tests:
    name: Validate the managed-local capability boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run formatting and unit tests in the pinned toolchain
        run: |
          docker run --rm \
            -v "${PWD}/engines/images/local-launcher:/src:ro" \
            -w /src \
            golang:1.26.3-alpine@sha256:91eda9776261207ea25fd06b5b7fed8d397dd2c0a283e77f2ab6e91bfa71079d \
            sh -ceu 'test -z "$(gofmt -d main.go main_test.go)"; go test ./...'

      - name: Reproduce the single-image OCI layout fixture
        run: |
          node scripts/generate-oci-layout-fixture.mjs
          git diff --exit-code -- \
            engines/images/local-launcher/testdata/oci-layout \
            engines/images/local-launcher/testdata/oci-layout-source

  semgrep-native-verify:
    name: Build and verify Semgrep natively on ${{ matrix.arch }}
    needs: [changes, launcher-tests]
    if: contains(fromJSON(needs.changes.outputs.engines), 'semgrep')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize the checksum-locked Semgrep rules and source
        run: node scripts/prepare-offline-engine-data.mjs semgrep

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build the complete native image and export its platform cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engines/images/semgrep/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: aiss-local/semgrep-combined${{ matrix.arch == 'arm64' && '-arm64' || '' }}:review
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=local-k8s-engine-semgrep-${{ matrix.arch }}
            type=gha,scope=local-k8s-engine-semgrep
          cache-to: ${{ inputs.mode != 'verify' && format('type=gha,mode=max,scope=local-k8s-engine-semgrep-{0}', matrix.arch) || '' }}

      - name: Verify pinned rules and selected original-source assembly
        run: |
          python3 -m unittest discover -s engines/images/semgrep -p 'test_*.py'

      - name: Verify complete result union, source attachment and runtime boundaries
        run: >-
          python3 engines/images/semgrep/run_managed_combination.py
          --archive .engine-cache/offline/semgrep-submodules/tests__semgrep-rules.tar.gz
          --image aiss-local/semgrep-combined${{ matrix.arch == 'arm64' && '-arm64' || '' }}:review
          --expected-version 1.174.0-4
          --output package-evidence/semgrep-native-${{ matrix.arch }}

      - name: Upload actual native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            package-evidence/semgrep-native-${{ matrix.arch }}/verification.json
            package-evidence/semgrep-native-${{ matrix.arch }}/*.log
            package-evidence/semgrep-native-${{ matrix.arch }}/*/semgrep.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish ${{ matrix.engine }} for amd64 + arm64
    needs: [changes, launcher-tests, semgrep-native-verify]
    if: >-
      always() && !cancelled() && inputs.mode != 'verify' &&
      needs.changes.result == 'success' && needs.changes.outputs.has_engines == 'true' &&
      needs.launcher-tests.result == 'success' &&
      (needs.semgrep-native-verify.result == 'success' || needs.semgrep-native-verify.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/teddashh/ai-security-scanner-engine-${{ matrix.engine }}
      IMAGE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize the checksum-locked offline database
        if: matrix.offline_data != 'none'
        run: node scripts/prepare-offline-engine-data.mjs "${{ matrix.offline_data }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=local-k8s-engine-${{ matrix.engine }}
            type=gha,scope=local-k8s-engine-${{ matrix.engine }}-amd64
            type=gha,scope=local-k8s-engine-${{ matrix.engine }}-arm64
          cache-to: type=gha,mode=max,scope=local-k8s-engine-${{ matrix.engine }}

      - name: Publish anonymous pull access
        if: steps.guard.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/teddashh/}"
          gh api --method PATCH "/user/packages/container/${package}" -f visibility=public

      - name: Download the actual amd64 native verification receipt
        if: matrix.engine == 'semgrep'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence/semgrep-native-amd64

      - name: Download the actual arm64 native verification receipt
        if: matrix.engine == 'semgrep'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-native-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence/semgrep-native-arm64

      - name: Verify anonymous access, platforms, version, and managed scan
        id: verify
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          ENGINE: ${{ matrix.engine }}
          EXPECTED_VERSION: ${{ matrix.version }}
          OUTPUT_FILE: ${{ matrix.output_file }}
          OUTPUT_KIND: ${{ matrix.output_kind }}
          VERSION_ARGS: ${{ matrix.version_args }}
          WORKSPACE: ${{ matrix.workspace }}
          REVISION: ${{ github.sha }}
        run: |
          docker logout ghcr.io
          raw_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${raw_manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${raw_manifest}")"
          test "${amd64_digest#sha256:}" != "${amd64_digest}"
          test "${arm64_digest#sha256:}" != "${arm64_digest}"

          if [ "${ENGINE}" = semgrep ]; then
            for arch in amd64 arm64; do
              receipt="package-evidence/semgrep-native-${arch}/verification.json"
              jq -e --arg arch "${arch}" --arg revision "${REVISION}" --arg version "${IMAGE_TAG}" '
                .source_revision == $revision and .expected_version == $version and
                .execution == {mode: "native", host_architecture: $arch, image_architecture: $arch} and
                .native_matches == {product: 10, upstream: 12, combined: 22, managed: 22} and
                .exact_full_result_union == true and
                .rejections_before_output == {"changed-rule": 126, "changed-provenance": 126, "extra-rule": 126, "writable-workspace": 126} and
                .source_attachment.selected_original_files == 1477 and
                .source_attachment.excluded_rule_absent == true and
                .source_attachment.unfiltered_rules_archive_absent == true and
                .source_attachment.rebuild_inputs_match == true
              ' "${receipt}" >/dev/null
              if [ "${arch}" = amd64 ]; then platform_digest="${amd64_digest}"; else platform_digest="${arm64_digest}"; fi
              docker pull --platform "linux/${arch}" "${IMAGE}@${platform_digest}"
              expected="$(jq -er '.image_payload.rootfs_payload_sha256 | select(test("^[0-9a-f]{64}$"))' "${receipt}")"
              python3 engines/images/semgrep/verify_image_payload.py \
                --image "${IMAGE}@${platform_digest}" --expected "${expected}" \
                > "package-evidence/semgrep-native-${arch}/published-payload.json"
            done
          fi

          docker run --platform linux/amd64 --rm \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=1024m \
            --entrypoint "/usr/local/bin/${ENGINE}" \
            "${IMAGE}@${DIGEST}" ${VERSION_ARGS} 2>&1 | grep -F "${EXPECTED_VERSION}"

          output="$(mktemp -d)"
          docker run --platform linux/amd64 --rm \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --pids-limit 512 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=1024m \
            --mount "type=bind,src=${PWD}/${WORKSPACE},dst=/workspace,readonly" \
            --mount "type=bind,src=${output},dst=/output" \
            "${IMAGE}@${DIGEST}" \
            --engine "${ENGINE}" --workspace /workspace --output /output

          test -f "${output}/${OUTPUT_FILE}"
          if [ "${OUTPUT_KIND}" = json ]; then
            jq -e . "${output}/${OUTPUT_FILE}" >/dev/null
          else
            while IFS= read -r line; do
              test -z "${line}" || jq -e . <<<"${line}" >/dev/null
            done < "${output}/${OUTPUT_FILE}"
          fi
          if [ "${ENGINE}" = semgrep ]; then
            jq -e '.errors == [] and (.results | length) == 22' "${output}/${OUTPUT_FILE}" >/dev/null
          fi
          if [ "${ENGINE}" = trivy ]; then
            jq -e \
              --arg imageID "sha256:8a67958da88c75f5703031bee7c99cf1e6bd2db77cbf70a2e1532bc64219c1bd" \
              '.ArtifactType == "container_image" and .Metadata.ImageID == $imageID and all((.Results // [])[]; .Class != "lang-pkgs")' \
              "${output}/${OUTPUT_FILE}" >/dev/null

            library_output="$(mktemp -d)"
            docker run --platform linux/amd64 --rm \
              --read-only --network none --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 512 --memory 4g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=1024m \
              --mount "type=bind,src=${PWD}/engines/images/trivy/testdata,dst=/workspace,readonly" \
              --mount "type=bind,src=${library_output},dst=/output" \
              "${IMAGE}@${DIGEST}" \
              --engine trivy --workspace /workspace --output /output
            jq -e '
              any((.Results // [])[];
                .Class == "lang-pkgs" and
                any((.Vulnerabilities // [])[];
                  .PkgName == "lodash" and .InstalledVersion == "4.17.20"
                )
              )
            ' "${library_output}/trivy.json" >/dev/null

            jar_workspace="$(mktemp -d)"
            base64 --decode \
              engines/images/local-launcher/testdata/trivy-java-db-test.jar.base64 \
              > "${jar_workspace}/unidentified.jar"
            test "$(sha256sum "${jar_workspace}/unidentified.jar" | cut -d ' ' -f1)" = \
              "a5c71902c4d26153f1256491362dc94e6598e70e3ba06f19ee02b1dfcd392470"
            jar_output="$(mktemp -d)"
            docker run --platform linux/amd64 --rm \
              --read-only --network none --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 512 --memory 4g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=1024m \
              --mount "type=bind,src=${jar_workspace},dst=/workspace,readonly" \
              --mount "type=bind,src=${jar_output},dst=/output" \
              "${IMAGE}@${DIGEST}" \
              --engine trivy --workspace /workspace --output /output
            jq -e '
              any((.Results // [])[];
                .Class == "lang-pkgs" and
                any((.Vulnerabilities // [])[];
                  .VulnerabilityID == "CVE-2024-23672" and
                  .PkgName == "org.apache.tomcat.embed:tomcat-embed-websocket" and
                  .InstalledVersion == "9.0.65"
                )
              )
            ' "${jar_output}/trivy-individual-packages.json" >/dev/null

          elif [ "${ENGINE}" = grype ]; then
            jq -e \
              --arg imageID "sha256:8a67958da88c75f5703031bee7c99cf1e6bd2db77cbf70a2e1532bc64219c1bd" \
              '.source.type == "image" and .source.target.imageID == $imageID and any(.matches[]; .artifact.name == "spring-core" and .artifact.version == "2.5.6.SEC03" and .artifact.type == "java-archive" and .artifact.language == "java")' \
              "${output}/${OUTPUT_FILE}" >/dev/null
          fi

          smoke_evidence="package-evidence/${ENGINE}-managed-smoke"
          mkdir -p "${smoke_evidence}"
          if [ "${ENGINE}" = trivy ]; then
            cp "${output}/${OUTPUT_FILE}" "${smoke_evidence}/trivy-oci.json"
            cp "${library_output}/trivy.json" "${smoke_evidence}/trivy-library.json"
            cp "${jar_output}/trivy-individual-packages.json" "${smoke_evidence}/trivy-jar.json"
            (
              cd "${smoke_evidence}"
              sha256sum trivy-jar.json trivy-library.json trivy-oci.json > SHA256SUMS.txt
            )
          else
            cp "${output}/${OUTPUT_FILE}" "${smoke_evidence}/${OUTPUT_FILE}"
            (
              cd "${smoke_evidence}"
              sha256sum "${OUTPUT_FILE}" > SHA256SUMS.txt
            )
          fi
          evidence_sha256="sha256:$(sha256sum "${smoke_evidence}/SHA256SUMS.txt" | cut -d ' ' -f 1)"
          test -s "${smoke_evidence}/SHA256SUMS.txt"
          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "evidence_sha256=${evidence_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record the published index and platform digests
        env:
          AMD64_DIGEST: ${{ steps.verify.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.verify.outputs.arm64_digest }}
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          EVIDENCE_SHA256: ${{ steps.verify.outputs.evidence_sha256 }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p package-evidence
          jq -n \
            --arg engine "${{ matrix.engine }}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg amd64Digest "${AMD64_DIGEST}" \
            --arg arm64Digest "${ARM64_DIGEST}" \
            --arg evidenceSha256 "${EVIDENCE_SHA256}" \
            --arg revision "${REVISION}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, anonymousPullVerified: true, managedSmokeEvidenceSha256: $evidenceSha256}' \
            > "package-evidence/${{ matrix.engine }}-image-manifest.json"
          printf 'Published and anonymously verified `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve signed publication and per-platform SBOM evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          mode: ${{ steps.guard.outputs.mode }}
          engine: ${{ matrix.engine }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          mode: ${{ steps.guard.outputs.mode }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Seal the downloadable evidence inventory
        run: |
          set -o pipefail
          (
            cd package-evidence
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.engine }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
