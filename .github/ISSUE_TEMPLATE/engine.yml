name: Engine integration
description: Propose or implement a complete scanner adapter
title: "[Engine]: "
labels: [engine]
body:
  - type: input
    id: repo
    attributes:
      label: Official repository
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Engine, rule/feed, and database licenses
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: Complete case lifecycle
      description: Explain manifest, scope permissions, runtime, parser, raw evidence, canonical mapping, coverage, export, and verification behavior.
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Filesystem, credential, and network access
    validations:
      required: true
