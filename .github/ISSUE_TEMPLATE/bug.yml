name: Bug report
description: Report a reproducible problem that does not expose sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer findings, private addresses, or unauthorized scan targets. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Scan tools (optional technical detail)
      description: Choose only if you know. Most Windows users should select Managed scan tools or Not sure.
      options: [Managed scan tools, Docker (advanced), Podman (advanced), Not sure]
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Use only synthetic or redacted examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
