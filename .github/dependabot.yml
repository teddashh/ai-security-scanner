version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node types follow the Node major that CI and the desktop build run on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Compatible updates arrive together. A major update, and any esbuild
      # minor (esbuild is 0.x, so a minor may break), arrives on its own.
      frontend:
        patterns: ["*"]
        exclude-patterns:
          - "esbuild"
          - "@tauri-apps/cli"
          - "@tauri-apps/plugin-opener"
          - "@tauri-apps/plugin-process"
          - "@tauri-apps/plugin-updater"
        update-types: ["minor", "patch"]
      # The release contract pins these plugins to the same exact versions as
      # their Rust crates, and the Windows installer template is reviewed
      # against this Tauri CLI release, so moving them is a release decision.
      desktop-release-pins:
        patterns:
          - "@tauri-apps/cli"
          - "@tauri-apps/plugin-opener"
          - "@tauri-apps/plugin-process"
          - "@tauri-apps/plugin-updater"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Patch updates arrive together. Minor updates arrive one crate at a time:
      # for a 0.x crate a minor release is a breaking change.
      rust:
        patterns: ["*"]
        exclude-patterns:
          - "tauri-plugin-opener"
          - "tauri-plugin-process"
          - "tauri-plugin-updater"
        update-types: ["patch"]
      desktop-release-pins:
        patterns:
          - "tauri-plugin-opener"
          - "tauri-plugin-process"
          - "tauri-plugin-updater"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL's analyze step refuses a configuration written by a different
      # init release, so the CodeQL actions move together.
      codeql:
        patterns: ["github/codeql-action*"]
