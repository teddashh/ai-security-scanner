kind: source
spec:
  name: aws
  path: /usr/local/libexec/cloudquery-source-aws
  registry: local
  destinations: [file]
  tables:
    - aws_iam_accounts
    - aws_iam_credential_reports
    - aws_iam_groups
    - aws_iam_password_policies
    - aws_iam_policies
    - aws_iam_roles
    - aws_iam_users
  spec:
    regions: [us-east-1]
---
kind: destination
spec:
  name: file
  path: /usr/local/libexec/cloudquery-destination-file
  registry: local
  write_mode: append
  spec:
    directory: /output
    format: json
    no_rotate: true
