---
version_mapping: {}
target_mapping:
  cis-1.11:
    - node
node:
  components:
    - kubelet
    - proxy
  kubelet:
    bins:
      - kubelet
    confs:
      - /workspace/node-snapshot/kubelet-config.yaml
    defaultconf: /workspace/node-snapshot/kubelet-config.yaml
    svc:
      - /workspace/node-snapshot/kubelet.service
    defaultsvc: /workspace/node-snapshot/kubelet.service
    kubeconfig:
      - /workspace/node-snapshot/kubelet.conf
    defaultkubeconfig: /workspace/node-snapshot/kubelet.conf
    cafile:
      - /workspace/node-snapshot/ca.crt
    defaultcafile: /workspace/node-snapshot/ca.crt
  proxy:
    bins:
      - kube-proxy
    confs:
      - /workspace/node-snapshot/kube-proxy.yaml
    defaultconf: /workspace/node-snapshot/kube-proxy.yaml
    kubeconfig:
      - /workspace/node-snapshot/kube-proxy.yaml
    defaultkubeconfig: /workspace/node-snapshot/kube-proxy.yaml
