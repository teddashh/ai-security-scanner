AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ai-security-scanner short-lived read-only assessment role. Delete this stack
  after the assessment and review all sessions and access keys separately.
Parameters:
  ScanRoleName:
    Type: String
    AllowedPattern: "^ai-security-scanner-[a-z0-9-]{1,40}$"
  TrustedPrincipalArn:
    Type: String
    Description: ARN of the identity allowed to assume the scan role.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 20
Resources:
  ReadOnlyScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ScanRoleName
      Description: Temporary read-only role for ai-security-scanner assessment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        - PolicyName: ai-security-scanner-verification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PermitNonMutatingSelfPolicyVerification
                Effect: Allow
                Action:
                  - iam:SimulatePrincipalPolicy
                Resource: "*"
        - PolicyName: ai-security-scanner-cloudquery-iam-inventory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PermitPinnedCloudQueryIamInventory
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - iam:GenerateCredentialReport
                  - iam:GetAccessKeyLastUsed
                  - iam:GetAccountAuthorizationDetails
                  - iam:GetAccountPasswordPolicy
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:GetGroupPolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:GetUser
                  - iam:GetUserPolicy
                  - iam:ListAccessKeys
                  - iam:ListAccountAliases
                  - iam:ListAttachedGroupPolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListAttachedUserPolicies
                  - iam:ListGroupPolicies
                  - iam:ListGroups
                  - iam:ListGroupsForUser
                  - iam:ListPolicyTags
                  - iam:ListRolePolicies
                  - iam:ListRoles
                  - iam:ListSSHPublicKeys
                  - iam:ListUserPolicies
                  - iam:ListUsers
                Resource: "*"
Outputs:
  ScanRoleArn:
    Value: !GetAtt ReadOnlyScanRole.Arn
  CleanupStackId:
    Value: !Ref AWS::StackId
