[package]
name = "ai-security-scanner"
version = "0.1.0"
description = "Local-first, repeatable security assessment casework"
authors = ["Ted Huang and ai-security-scanner contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[lib]
name = "ai_security_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]
cli = ["dep:clap", "dep:directories"]
broker = []
adapter-launcher = []

[[bin]]
name = "ai-security-scanner-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "ai-security-scanner"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "ai-security-scanner-bootstrap-broker"
path = "src/bin/bootstrap_broker.rs"
required-features = ["broker"]

[[bin]]
name = "ai-security-scanner-adapter-launcher"
path = "src/bin/adapter_launcher.rs"
required-features = ["adapter-launcher"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env"], optional = true }
directories = { version = "6.0.0", optional = true }
ed25519-dalek = "3.0.0"
flate2 = "1.1.9"
getrandom = "0.4.3"
hex = "0.4.3"
idna = "1.1.0"
ipnet = { version = "2.12.0", features = ["serde"] }
libc = "0.2.183"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "sync", "time", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
