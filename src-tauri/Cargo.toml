[package]
name = "ai-security-scanner"
version = "0.1.8"
description = "Local-first, repeatable security assessment casework"
authors = ["Ted Huang and ai-security-scanner contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/teddashh/ai-security-scanner"
homepage = "https://github.com/teddashh/ai-security-scanner"
readme = "../README.md"
publish = false

[lib]
name = "ai_security_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
]
cli = ["dep:clap"]
installer-runtime-cache = []
broker = []
adapter-launcher = []
egress-gateway = []
release-verifier = ["dep:minisign-verify"]

[[bin]]
name = "ai-security-scanner-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "ai-security-scanner"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "ai-security-scanner-bootstrap-broker"
path = "src/bin/bootstrap_broker.rs"
required-features = ["broker"]

[[bin]]
name = "ai-security-scanner-adapter-launcher"
path = "src/bin/adapter_launcher.rs"
required-features = ["adapter-launcher"]

[[bin]]
name = "ai-security-scanner-egress-gateway"
path = "src/bin/egress_gateway.rs"
required-features = ["egress-gateway"]

[[bin]]
name = "ai-security-scanner-egress-probe"
path = "src/bin/egress_probe.rs"
required-features = ["egress-gateway"]

[[bin]]
name = "ai-security-scanner-updater-verifier"
path = "src/bin/updater_verifier.rs"
required-features = ["release-verifier"]

[build-dependencies]
sha2 = "0.11.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"], optional = true }
# Platform data-root verification is library code used by every binary feature.
directories = "6.0.0"
ed25519-dalek = "3.0.0"
flate2 = "1.1.9"
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4.3"
ignore = "0.4.23"
idna = "1.1.0"
ipnet = { version = "2.12.0", features = ["serde"] }
libc = "0.2.183"
minisign-verify = { version = "0.2.5", optional = true }
quick-xml = { version = "0.42.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "getrandom", "std"] }
tar = "0.4.46"
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-process = { version = "=2.3.1", optional = true }
tauri-plugin-updater = { version = "=2.10.1", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep getifaddrs ownership and pointer traversal behind a maintained safe API.
nix = { version = "0.31.3", features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
